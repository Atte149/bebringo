units:
  - id: "u1"
    titleRu: "Первые слова"
    chapters:
      - id: "c1"
        titleRo: "Salut"
        titleRu: "Приветствие"
        scenes:
          - id: "s1"
            titleRo: "Bună ziua"
            titleRu: "Приветствия дня"
            blocks:
              - id: "b1"
                titleRo: "Bună ziua"
                titleRu: "Утро, день и вечер"
                steps:
                  - type: "insight"
                    lemma: "buna-ziua"
                    title: "Приветствия в течение дня"
                    body: "В румынском языке приветствие строится со словом **bună** («добрая/хорошая»): утром — **Bună dimineața**, днём — **Bună ziua**, вечером — **Bună seara**. А слово **Mulțumesc** значит «спасибо»."
                    tip: "Буква ă звучит как безударный русский «э/а» (шва), а ț — как русская «ц»."
                    examples:
                      - { primary: "Bună dimineața / Bună ziua / Bună seara", secondary: "Доброе утро / Добрый день / Добрый вечер" }
                      - { primary: "Mulțumesc foarte mult!", secondary: "Большое спасибо!" }
                  - type: "listening"
                    lemma: "buna-dimineata"
                    audio: "Bună dimineața"
                    translation: "Доброе утро"
                    options: ["Доброе утро", "Добрый вечер", "Добрый день", "До свидания"]
                  - type: "recognition"
                    lemma: "buna-seara"
                    word: "Bună seara"
                    translation: "Добрый вечер"
                    options: ["Добрый вечер", "Доброе утро", "Спасибо", "Извините"]
                  - type: "typein"
                    lemma: "buna"
                    prompt: "Привет!"
                    answer: "Bună!"
                    answers: ["Buna"]
                    hint: "Неформальное приветствие; одно слово."
                  - type: "assemble"
                    lemma: "multumesc"
                    prompt: "Большое спасибо."
                    tokens: ["Mulțumesc", "foarte", "mult", "ziua", "seara"]
                    answer: "Mulțumesc foarte mult."

              - id: "b2"
                titleRo: "Ce faci?"
                titleRu: "Как дела?"
                steps:
                  - type: "recognition"
                    lemma: "ce-faci"
                    word: "Ce faci?"
                    translation: "Как дела?"
                    options: ["Как дела?", "Как вас зовут?", "Откуда вы?", "Сколько стоит?"]
                  - type: "listening"
                    lemma: "bine"
                    audio: "Sunt bine, mulțumesc."
                    translation: "Я в порядке, спасибо"
                    options: ["Я в порядке, спасибо", "Я из России", "Меня зовут Григоре", "До свидания"]
                  - type: "recognition"
                    lemma: "la-revedere"
                    word: "La revedere"
                    translation: "До свидания"
                    options: ["До свидания", "Добрый день", "Спасибо", "Привет"]
                  - type: "assemble"
                    lemma: "cine"
                    prompt: "Кто ты?"
                    tokens: ["Cine", "ești", "unde", "bine"]
                    answer: "Cine ești?"
                  - type: "typein"
                    lemma: "nume"
                    prompt: "Как вас зовут? (вежливо)"
                    answer: "Cum vă numiți?"
                    answers: ["Cum va numiti?"]
                    hint: "Вежливый вопрос; глагол «называться» в форме «вы»."

      - id: "c2"
        titleRo: "Cine ești?"
        titleRu: "Знакомство"
        scenes:
          - id: "s2"
            titleRo: "Mă numesc"
            titleRu: "Как тебя зовут?"
            blocks:
              - id: "b3"
                titleRo: "Mă numesc"
                titleRu: "Представляемся"
                steps:
                  - type: "insight"
                    lemma: "ma-numesc"
                    title: "Как представиться по-румынски"
                    body: "Чтобы назвать своё имя, скажите **Mă numesc...** («Меня зовут...»). Вежливый вопрос к собеседнику — **Cum vă numiți?** («Как вас зовут?»), а ответ при знакомстве — **Îmi pare bine!** («Приятно познакомиться!»)."
                    examples:
                      - { primary: "Cum vă numiți?", secondary: "Как вас зовут? (вежливо)" }
                      - { primary: "Mă numesc Anna. Îmi pare bine!", secondary: "Меня зовут Анна. Приятно познакомиться!" }
                  - type: "listening"
                    lemma: "nume"
                    audio: "Numele meu este Grigore."
                    translation: "Моё имя — Григоре"
                    options: ["Моё имя — Григоре", "Я из Клужа", "Я программист", "Мне десять лет"]
                  - type: "recognition"
                    lemma: "imi-pare-bine"
                    word: "Îmi pare bine"
                    translation: "Приятно познакомиться"
                    options: ["Приятно познакомиться", "До свидания", "Спасибо", "Как дела?"]
                  - type: "assemble"
                    lemma: "cum"
                    prompt: "Как вас зовут?"
                    tokens: ["Cum", "vă", "numiți", "mă", "bine"]
                    answer: "Cum vă numiți?"
                  - type: "typein"
                    lemma: "ma-numesc"
                    prompt: "Меня зовут Анна."
                    answer: "Mă numesc Anna."
                    answers: ["Mă numesc Ana."]
                    hint: "Формула знакомства: возвратное «mă» + глагол «называюсь» + имя."

              - id: "b4"
                titleRo: "De unde ești?"
                titleRu: "Откуда ты?"
                steps:
                  - type: "recognition"
                    lemma: "unde"
                    word: "De unde ești?"
                    translation: "Откуда ты?"
                    options: ["Откуда ты?", "Куда ты?", "Как дела?", "Кто ты?"]
                  - type: "listening"
                    lemma: "din"
                    audio: "Sunt din Rusia."
                    translation: "Я из России"
                    options: ["Я из России", "Я из Румынии", "Я из Клужа", "Я дома"]
                  - type: "recognition"
                    lemma: "sunt"
                    word: "Sunt din România"
                    translation: "Я из Румынии"
                    options: ["Я из Румынии", "Я из России", "Я в Румынии", "Я люблю Румынию"]
                  - type: "assemble"
                    lemma: "sunteti"
                    prompt: "Откуда вы?"
                    tokens: ["De", "unde", "sunteți", "din", "cine"]
                    answer: "De unde sunteți?"
                  - type: "typein"
                    lemma: "este"
                    prompt: "Кто это?"
                    answer: "Cine este?"
                    answers: ["Cine e?"]
                    hint: "Вопрос: «кто» + глагол «есть»."

  - id: "u2"
    titleRu: "Каждый день"
    chapters:
      - id: "c3"
        titleRo: "La cafenea"
        titleRu: "В кафе"
        scenes:
          - id: "s3"
            titleRo: "O cafea, te rog"
            titleRu: "Заказ напитков"
            blocks:
              - id: "b5"
                titleRo: "O cafea, te rog"
                titleRu: "Кофе, чай и вода"
                steps:
                  - type: "recognition"
                    lemma: "cafea"
                    word: "cafea"
                    translation: "кофе"
                    options: ["кофе", "чай", "вода", "счёт"]
                  - type: "listening"
                    lemma: "te-rog"
                    audio: "O cafea, te rog."
                    translation: "Кофе, пожалуйста"
                    options: ["Кофе, пожалуйста", "Чай, пожалуйста", "Счёт, пожалуйста", "Воды, пожалуйста"]
                  - type: "recognition"
                    lemma: "apa"
                    word: "apă"
                    translation: "вода"
                    options: ["вода", "кофе", "чай", "молоко"]
                  - type: "assemble"
                    lemma: "vreau"
                    prompt: "Я хочу кофе."
                    tokens: ["Vreau", "o", "cafea", "apă", "un"]
                    answer: "Vreau o cafea."
                  - type: "typein"
                    lemma: "ceai"
                    prompt: "Чай, пожалуйста."
                    answer: "Un ceai, te rog."
                    answers: ["Un ceai, vă rog."]
                    hint: "Заказ: неопределённый артикль + существительное + вежливая просьба."

              - id: "b6"
                titleRo: "Cât costă?"
                titleRu: "Счёт и цена"
                steps:
                  - type: "insight"
                    lemma: "cat-costa"
                    title: "Определённый артикль на конце слова"
                    body: "В румынском языке определённый артикль («этот конкретный») присоединяется **к концу существительного**: **o cafea** (какой-то кофе) → **cafeaua** (этот кофе), **o notă** → **nota** (счёт)."
                    examples:
                      - { primary: "Cât costă cafeaua?", secondary: "Сколько стоит (этот) кофе?" }
                      - { primary: "Nota, vă rog!", secondary: "Счёт, пожалуйста!" }
                  - type: "listening"
                    lemma: "cinci"
                    audio: "Costă cinci lei."
                    translation: "Пять лей"
                    options: ["Пять лей", "Десять лей", "Пять евро", "Два лея"]
                  - type: "recognition"
                    lemma: "lei"
                    word: "lei"
                    translation: "лей"
                    options: ["лей", "евро", "рублей", "долларов"]
                  - type: "assemble"
                    lemma: "nota"
                    prompt: "Счёт, пожалуйста."
                    tokens: ["Nota", "vă", "rog", "cinci", "costă"]
                    answer: "Nota, vă rog."
                  - type: "typein"
                    lemma: "cat-costa"
                    prompt: "Сколько стоит кофе?"
                    answer: "Cât costă cafeaua?"
                    hint: "Вопрос о цене; кофе — с определённым артиклем на конце."

      - id: "c4"
        titleRo: "La gară"
        titleRu: "На вокзале"
        scenes:
          - id: "s4"
            titleRo: "Un bilet"
            titleRu: "Покупка билета"
            blocks:
              - id: "b7"
                titleRo: "Un bilet"
                titleRu: "Билет до Клужа"
                steps:
                  - type: "recognition"
                    lemma: "cinci"
                    word: "cinci"
                    translation: "пять"
                    options: ["пять", "десять", "два", "восемь"]
                  - type: "listening"
                    lemma: "cluj"
                    audio: "Vreau un bilet la Cluj."
                    translation: "Я хочу билет до Клужа"
                    options: ["Я хочу билет до Клужа", "Я хочу билет до Бухареста", "Я хочу кофе", "Я еду в Клуж"]
                  - type: "recognition"
                    lemma: "tren"
                    word: "tren"
                    translation: "поезд"
                    options: ["поезд", "билет", "вокзал", "вагон"]
                  - type: "assemble"
                    lemma: "bilet"
                    prompt: "Я хочу билет на поезд."
                    tokens: ["Vreau", "un", "bilet", "de", "tren", "gară", "la"]
                    answer: "Vreau un bilet de tren."
                  - type: "typein"
                    lemma: "va-rog"
                    prompt: "Один билет, пожалуйста."
                    answer: "Un bilet, vă rog."
                    answers: ["Un bilet, te rog."]
                    hint: "Покупка: неопределённый артикль + существительное + вежливая форма «вы»."

              - id: "b8"
                titleRo: "La ce oră?"
                titleRu: "Расписание"
                steps:
                  - type: "insight"
                    lemma: "tren"
                    title: "Артикль мужского и среднего рода (-ul)"
                    body: "Слова мужского и среднего рода на согласную получают определённый артикль **-ul** на конце: **un tren** (поезд) → **trenul** (этот поезд), **un vagon** → **vagonul** (вагон)."
                    examples:
                      - { primary: "Trenul pleacă la ora opt.", secondary: "Поезд отправляется в восемь часов." }
                      - { primary: "La ce oră pleacă trenul?", secondary: "В котором часу отправляется поезд?" }
                  - type: "listening"
                    lemma: "pleaca"
                    audio: "Trenul pleacă la ora opt."
                    translation: "Поезд отправляется в восемь"
                    options: ["Поезд отправляется в восемь", "Поезд отправляется в девять", "Поезд уже ушёл", "Поезд опаздывает"]
                  - type: "recognition"
                    lemma: "gara"
                    word: "gară"
                    translation: "вокзал"
                    options: ["вокзал", "поезд", "билет", "вагон"]
                  - type: "assemble"
                    lemma: "ora"
                    prompt: "В котором часу отправляется поезд?"
                    tokens: ["La", "ce", "oră", "pleacă", "trenul", "opt", "bilet"]
                    answer: "La ce oră pleacă trenul?"
                  - type: "typein"
                    lemma: "noua"
                    prompt: "Поезд отправляется в девять."
                    answer: "Trenul pleacă la ora nouă."
                    hint: "Поезд с артиклем + глагол «отправляется» + время (9)."

          - id: "s5"
            titleRo: "În tren"
            titleRu: "В поезде"
            blocks:
              - id: "b9"
                titleRo: "Unde e vagonul?"
                titleRu: "Вагон и место"
                steps:
                  - type: "recognition"
                    lemma: "opt"
                    word: "opt"
                    translation: "восемь"
                    options: ["восемь", "семь", "девять", "десять"]
                  - type: "listening"
                    lemma: "sapte"
                    audio: "Unde este vagonul șapte?"
                    translation: "Где седьмой вагон?"
                    options: ["Где седьмой вагон?", "Где моё место?", "Где вокзал?", "Где поезд?"]
                  - type: "recognition"
                    lemma: "loc"
                    word: "loc"
                    translation: "место"
                    options: ["место", "вагон", "билет", "стол"]
                  - type: "assemble"
                    lemma: "locul-meu"
                    prompt: "Моё место — седьмое."
                    tokens: ["Locul", "meu", "este", "șapte", "vagon", "opt"]
                    answer: "Locul meu este șapte."
                  - type: "typein"
                    lemma: "vagon"
                    prompt: "Где вагон?"
                    answer: "Unde este vagonul?"
                    answers: ["Unde e vagonul?"]
                    hint: "Вопрос: «где» + глагол «есть» + вагон с артиклем."

              - id: "b10"
                titleRo: "Am ajuns"
                titleRu: "Прибытие"
                steps:
                  - type: "insight"
                    lemma: "ajuns"
                    title: "Прошедшее время: Am ajuns"
                    body: "Прошедшее время для «я» и «мы» строится с помощником **am**: **ajung** (приезжаю) → **am ajuns** (я приехал / мы приехали)."
                    examples:
                      - { primary: "Ajung la Cluj → Am ajuns la Cluj", secondary: "Приезжаю в Клуж → Приехал(и) в Клуж" }
                  - type: "listening"
                    lemma: "cluj"
                    audio: "Am ajuns la Cluj."
                    translation: "Мы приехали в Клуж"
                    options: ["Мы приехали в Клуж", "Мы едем в Клуж", "Мы живём в Клуже", "Мы из Клужа"]
                  - type: "recognition"
                    lemma: "acum"
                    word: "acum"
                    translation: "сейчас"
                    options: ["сейчас", "потом", "вчера", "завтра"]
                  - type: "typein"
                    lemma: "ajuns"
                    prompt: "Я приехал."
                    answer: "Am ajuns."
                    hint: "Прошедшее время: помощник «am» + причастие от «приезжать»."
                  - type: "transform"
                    lemma: "ajung"
                    source: "Ajung la Cluj."
                    instruction: "Поставьте в прошедшее время"
                    answer: "Am ajuns la Cluj."


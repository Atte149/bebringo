                    answer: "Două surori."
                    answers: ["Doua surori."]
                    hint: "Числительное «две» + множественное число «сёстры»."
                  - type: "transform"
                    lemma: "frate"
                    source: "un frate"
                    instruction: "Поставьте во множественное число (два брата)"
                    answer: "doi frați"

